<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YouTube" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=9" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=9" />
  <title>YouTube</title>
  <style>
    :root {
      --ios-blue: #0091FF;
      --ios-blue-active: #0077E6;
      --ios-red-pill: #FF453A;
      --text-primary: #FFFFFF;
      --text-secondary: rgba(235, 235, 245, 0.56);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100%;
      background-color: #141210;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Warm dark ambient blurred background matching Screenshot 3 */
    .screen-bg {
      position: fixed;
      top: -100px;
      left: -100px;
      right: -100px;
      bottom: -100px;
      background:
        radial-gradient(circle at 22% 34%, rgba(66, 46, 30, 0.52) 0%, transparent 48%),
        radial-gradient(circle at 60% 45%, rgba(44, 34, 26, 0.45) 0%, transparent 58%),
        radial-gradient(circle at 50% 80%, rgba(28, 25, 22, 0.65) 0%, transparent 60%),
        #141210;
      z-index: 0;
      transition: opacity 0.15s ease;
    }

    body.yt-mode .screen-bg {
      opacity: 0;
    }

    /* Main Time Limit Lock Screen */
    .lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px calc(env(safe-area-inset-bottom, 16px) + 34px);
      transition: filter 0.25s ease, opacity 0.25s ease;
    }

    /* Dim lock screen when floating menu is open (matching Screenshot 2) */
    .lock-screen.dimmed .center-content,
    .lock-screen.dimmed .bottom-actions {
      opacity: 0.42;
      pointer-events: none;
    }

    .lock-screen.dimmed .ok-btn {
      background: rgba(58, 58, 60, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.55);
    }

    /* Center Hourglass + Text positioned at upper-middle like Screenshot 3 */
    .center-content {
      margin-top: 21vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      transition: opacity 0.22s ease;
    }

    .hourglass-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .hourglass-btn:active {
      transform: scale(0.94);
    }

    .hourglass-svg {
      width: 58px;
      height: 76px;
      overflow: visible;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #ffffff;
      margin-bottom: 5px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      color: rgba(235, 235, 245, 0.55);
      line-height: 1.3;
    }

    /* Bottom Two Pill Buttons matching Screenshot 3 */
    .bottom-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      transition: opacity 0.22s ease;
    }

    .ok-btn {
      width: 202px;
      height: 52px;
      border-radius: 999px;
      background-color: var(--ios-blue);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .ok-btn:active {
      background-color: var(--ios-blue-active);
      transform: scale(0.97);
    }

    .ask-btn {
      width: 202px;
      height: 52px;
      border-radius: 999px;
      background: rgba(58, 56, 54, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.11);
      color: #FFFFFF;
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: -0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .ask-btn:active {
      background: rgba(78, 76, 74, 0.85);
      transform: scale(0.97);
    }

    /* Invisible Backdrop for Floating Card */
    .overlay-backdrop {
      position: fixed;
      top: -100px;
      left: -100px;
      right: -100px;
      bottom: -100px;
      background: rgba(0, 0, 0, 0.22);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .overlay-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Center Floating Glassmorphic Menu Card matching Screenshot 2 */
    .floating-menu-card {
      position: fixed;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%) scale(0.94);
      width: calc(100% - 68px);
      max-width: 344px;
      background: rgba(40, 40, 42, 0.86);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 34px;
      padding: 17px 16px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 11px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      transition: opacity 0.2s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .floating-menu-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .pill-menu-btn {
      width: 100%;
      height: 52px;
      border-radius: 999px;
      background: rgba(84, 84, 88, 0.65);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.1s ease;
    }

    .pill-menu-btn:active {
      background: rgba(112, 112, 116, 0.8);
      transform: scale(0.98);
    }

    /* Screen Time Passcode Sheet Modal matching Screenshot 1 */
    .passcode-modal {
      position: fixed;
      left: 0;
      right: 0;
      top: max(42px, env(safe-area-inset-top, 42px));
      bottom: -80px;
      z-index: 40;
      background: #1C1C1E;
      border-top-left-radius: 38px;
      border-top-right-radius: 38px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.65), 0 80px 0 80px #1C1C1E;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px calc(env(safe-area-inset-bottom, 20px) + 94px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(100%);
      transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .passcode-modal.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .passcode-topbar {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    /* Circular dark X close button in top-right matching Screenshot 1 */
    .passcode-close-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #2C2C2E;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #E5E5EA;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.1s ease;
    }

    .passcode-close-btn:active {
      background: #3A3A3C;
      transform: scale(0.94);
    }

    .passcode-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4vh;
      margin-bottom: auto;
    }

    .passcode-title {
      font-size: 17.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
      margin-bottom: 24px;
    }

    .passcode-dots {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }

    .passcode-dots.shake {
      animation: iosShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes iosShake {
      10%, 90% { transform: translateX(-6px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-12px); }
      40%, 60% { transform: translateX(12px); }
    }

    .dot {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      border: 1.6px solid rgba(255, 255, 255, 0.88);
      background: transparent;
      transition: background-color 0.1s ease;
    }

    .dot.filled {
      background: #ffffff;
    }

    /* Red Pill Badge for Failed Attempts matching Screenshot 1 */
    .failed-badge {
      background-color: var(--ios-red-pill);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      padding: 5px 22px;
      border-radius: 999px;
      letter-spacing: -0.1px;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .failed-badge.visible {
      opacity: 1;
    }

    /* iOS Numeric Keypad at bottom of Passcode Sheet */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 76px);
      gap: 14px 26px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .key-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .key-btn:active {
      background: rgba(255, 255, 255, 0.34);
    }

    .key-num {
      font-size: 32px;
      font-weight: 300;
      line-height: 1;
    }

    .key-letters {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.8px;
      margin-top: 2px;
      min-height: 11px;
    }

    .key-empty {
      visibility: hidden;
    }

    .key-delete {
      background: transparent;
      font-size: 16px;
      font-weight: 400;
    }

    .key-delete:active {
      background: transparent;
      opacity: 0.6;
    }

    /*
     * ===================================================================
     * NATIVE CRISP VECTOR YOUTUBE UI (Replaces blurry JPEG header/text)
     * ===================================================================
     */
    .youtube-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--full-screen-h, calc(100vh + env(safe-area-inset-bottom, 34px)));
      width: 100%;
      z-index: 50;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .youtube-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .yt-app-container {
      width: 100%;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: #0f0f0f;
      position: relative;
      overflow: hidden;
    }

    /* Top spacer absorbs any extra vertical space at the top in pure #0f0f0f so the bottom sits 100% flush with the floor */
    .yt-status-spacer {
      flex: 1;
      min-height: env(safe-area-inset-top, 44px);
      background: #0f0f0f;
    }

    /* Crisp Vector YouTube Top Bar */
    .yt-topbar {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .yt-logo-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 4px 0;
    }

    .yt-logo-btn:active {
      opacity: 0.75;
    }

    .yt-wordmark {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", sans-serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.9px;
      color: #ffffff;
    }

    .yt-top-icons {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .yt-icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    .yt-notif-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #FF0033;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 1.5px solid #0f0f0f;
    }

    /* Crisp Navigation Tabs (Home, Subs, Music, Live, More) */
    .yt-tabs {
      height: 40px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 28px;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .yt-tab {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 14.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: -0.1px;
    }

    .yt-tab.active {
      color: #ffffff;
      font-weight: 600;
    }

    .yt-tab.active::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #FF0033;
      border-radius: 2px;
    }

    /* First Video Thumbnail + Crisp Metadata Row */
    .yt-thumb-box {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: #000;
    }

    .yt-thumb-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .yt-duration-badge {
      position: absolute;
      right: 10px;
      bottom: 8px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 5px;
      letter-spacing: 0.2px;
    }

    /* Crisp Vector Video Title & Channel Row */
    .yt-video-meta {
      padding: 12px 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .yt-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .yt-meta-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .yt-video-title {
      font-size: 15.5px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .yt-video-sub {
      font-size: 12.5px;
      color: #AAAAAA;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .yt-more-dots {
      color: #ffffff;
      padding: 4px;
      font-size: 18px;
      line-height: 1;
      letter-spacing: 1px;
    }

    /* Ad Image anchored flush to the very bottom of the physical screen */
    .yt-ad-container {
      position: relative;
      width: 100%;
      flex-shrink: 0;
      background: #0f0f0f;
    }

    .yt-ad-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Revealed Passcode Popup when clicking YouTube logo */
    .code-reveal-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: -50px;
      z-index: 80;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .code-reveal-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .code-reveal-card {
      width: 100%;
      max-width: 300px;
      background: rgba(44, 44, 46, 0.96);
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 22px 20px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.6);
    }

    .code-reveal-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(235, 235, 245, 0.6);
    }

    .code-reveal-value {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #30D158;
      font-variant-numeric: tabular-nums;
      padding-left: 8px;
    }

    .code-history-list {
      font-size: 13px;
      color: rgba(235, 235, 245, 0.65);
      line-height: 1.4;
    }

    .code-reveal-actions {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 6px;
    }

    .code-reveal-btn {
      flex: 1;
      padding: 11px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .code-reveal-btn.primary {
      background: var(--ios-blue);
      color: #ffffff;
    }

    .code-reveal-btn.secondary {
      background: #3A3A3C;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Warm Dark Ambient Background matching Screenshot 3 -->
  <div class="screen-bg"></div>

  <!-- Main iOS 27 Time Limit Lock Screen -->
  <main id="lockScreen" class="lock-screen">
    <div class="center-content">
      <button id="hourglassBtn" class="hourglass-btn" title="Tap for Fullscreen">
        <!-- Blue Hourglass Icon matching Screenshot 3 -->
        <svg class="hourglass-svg" viewBox="0 0 64 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6C8.68629 6 6 8.68629 6 12V19C6 27.6 11.4 35.1 19.3 39.2C21.8 40.5 21.8 43.5 19.3 44.8C11.4 48.9 6 56.4 6 65V72C6 75.3137 8.68629 78 12 78H52C55.3137 78 58 75.3137 58 72V65C58 56.4 52.6 48.9 44.7 44.8C42.2 43.5 42.2 40.5 44.7 39.2C52.6 35.1 58 27.6 58 19V12C58 8.68629 55.3137 6 52 6H12Z" fill="#0080FF"/>
          <path d="M14.5 71.5C14.5 69.8 23.8 58.2 29.5 53.5C31.0 52.3 33.0 52.3 34.5 53.5C40.2 58.2 49.5 69.8 49.5 71.5H14.5Z" fill="#2A2624"/>
        </svg>
      </button>

      <h1 class="title">Time Limit</h1>
      <p id="limitMessage" class="subtitle">You’ve reached your limit on YouTube.</p>
    </div>

    <div class="bottom-actions">
      <button id="okBtn" class="ok-btn">OK</button>
      <button id="askBtn" class="ask-btn">Ask for More Time</button>
    </div>
  </main>

  <!-- Backdrop for Center Floating Cards -->
  <div id="backdrop" class="overlay-backdrop"></div>

  <!-- 1. "Ask for More Time" Floating Center Card matching Screenshot 2 -->
  <div id="askSheet" class="floating-menu-card" aria-hidden="true">
    <button class="pill-menu-btn" data-action="one-more-minute">One More Minute</button>
    <button class="pill-menu-btn" data-action="send-request">Send Request</button>
    <button class="pill-menu-btn" data-action="enter-passcode">Enter Screen Time Passcode</button>
    <button class="pill-menu-btn" data-action="cancel">Cancel</button>
  </div>

  <!-- 2. Post-Passcode Approval Duration Floating Card -->
  <div id="approveSheet" class="floating-menu-card" aria-hidden="true">
    <button class="pill-menu-btn" data-approve="15">Approve for 15 minutes</button>
    <button class="pill-menu-btn" data-approve="60">Approve for an hour</button>
    <button class="pill-menu-btn" data-approve="day">Approve all day</button>
    <button class="pill-menu-btn" data-action="cancel">Cancel</button>
  </div>

  <!-- 3. Screen Time Passcode Modal Sheet matching Screenshot 1 -->
  <div id="passcodeModal" class="passcode-modal" aria-hidden="true">
    <div class="passcode-topbar">
      <button id="passcodeCancelBtn" class="passcode-close-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 2L16 16M16 2L2 16" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="passcode-center">
      <div class="passcode-title">Enter Screen Time Passcode</div>
      <div id="passcodeDots" class="passcode-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div id="failedBadge" class="failed-badge">8 Failed Passcode Attempts</div>
    </div>

    <div class="keypad">
      <button class="key-btn" data-digit="1"><span class="key-num">1</span><span class="key-letters"></span></button>
      <button class="key-btn" data-digit="2"><span class="key-num">2</span><span class="key-letters">ABC</span></button>
      <button class="key-btn" data-digit="3"><span class="key-num">3</span><span class="key-letters">DEF</span></button>
      <button class="key-btn" data-digit="4"><span class="key-num">4</span><span class="key-letters">GHI</span></button>
      <button class="key-btn" data-digit="5"><span class="key-num">5</span><span class="key-letters">JKL</span></button>
      <button class="key-btn" data-digit="6"><span class="key-num">6</span><span class="key-letters">MNO</span></button>
      <button class="key-btn" data-digit="7"><span class="key-num">7</span><span class="key-letters">PQRS</span></button>
      <button class="key-btn" data-digit="8"><span class="key-num">8</span><span class="key-letters">TUV</span></button>
      <button class="key-btn" data-digit="9"><span class="key-num">9</span><span class="key-letters">WXYZ</span></button>
      <div class="key-btn key-empty"></div>
      <button class="key-btn" data-digit="0"><span class="key-num">0</span><span class="key-letters"></span></button>
      <button id="deleteKeyBtn" class="key-btn key-delete">Delete</button>
    </div>
  </div>

  <!-- 4. Unlocked High-Res YouTube Screen (Crisp Vector Header, Logo, Tabs, Titles + Feed) -->
  <div id="youtubeScreen" class="youtube-screen">
    <div class="yt-app-container">
      <div class="yt-status-spacer"></div>

      <!-- Crisp Vector YouTube Header (Tapping YouTube Logo reveals the entered code) -->
      <header class="yt-topbar">
        <button id="ytLogoBtn" class="yt-logo-btn" aria-label="YouTube Logo">
          <svg width="31" height="22" viewBox="0 0 31 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="31" height="22" rx="6" fill="#FF0033"/>
            <path d="M12.5 6.5L20.5 11L12.5 15.5V6.5Z" fill="white"/>
          </svg>
          <span class="yt-wordmark">YouTube</span>
        </button>

        <div class="yt-top-icons">
          <!-- Messages/Chat Icon -->
          <div class="yt-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <!-- Notification Bell with Red '1' Badge -->
          <div class="yt-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span class="yt-notif-badge">1</span>
          </div>
          <!-- Search Magnifying Glass -->
          <div class="yt-icon-wrap">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.35" y2="16.35"/>
            </svg>
          </div>
        </div>
      </header>

      <!-- Crisp Vector Navigation Tabs -->
      <nav class="yt-tabs">
        <div class="yt-tab active">Home</div>
        <div class="yt-tab">Subs</div>
        <div class="yt-tab">Music</div>
        <div class="yt-tab">Live</div>
        <div class="yt-tab">More</div>
      </nav>

      <!-- Video 1 Thumbnail + Crisp Timestamp -->
      <div class="yt-thumb-box">
        <img src="yt-thumb.jpg?v=9" alt="Video Thumbnail" class="yt-thumb-img" />
        <span class="yt-duration-badge">18:59</span>
      </div>

      <!-- Crisp Vector Video Title & Channel Info -->
      <div class="yt-video-meta">
        <img src="yt-avatar.png?v=9" alt="Avatar" class="yt-avatar" />
        <div class="yt-meta-text">
          <div class="yt-video-title">Getting 20k is WAY TOO EASY</div>
          <div class="yt-video-sub">
            <span>DXZA</span>
            <span>▷ 2.7k</span>
            <span>4 hr ago</span>
          </div>
        </div>
        <div class="yt-more-dots">•••</div>
      </div>

      <!-- Bottom Ad & Navigation Bar -->
      <div class="yt-ad-container">
        <img src="yt-ad.jpg?v=9" alt="Feed" class="yt-ad-img" />
      </div>
    </div>
  </div>

  <!-- 5. Modal Showing the Entered Passcode when YouTube Logo is Clicked -->
  <div id="codeRevealModal" class="code-reveal-modal">
    <div class="code-reveal-card">
      <div class="code-reveal-label">Entered Screen Time Code</div>
      <div id="revealedCodeText" class="code-reveal-value">----</div>
      <div id="codeHistoryText" class="code-history-list"></div>
      <div class="code-reveal-actions">
        <button id="relockBtn" class="code-reveal-btn secondary">Lock Again</button>
        <button id="closeRevealBtn" class="code-reveal-btn primary">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Force exact physical screen height on iPhone standalone web apps so there is zero bottom gray bar
    function syncFullIphoneHeight() {
      const fullH = Math.max(window.screen.height || 0, window.innerHeight || 0);
      if (fullH > 0) {
        document.documentElement.style.setProperty('--full-screen-h', fullH + 'px');
      }
    }
    syncFullIphoneHeight();
    window.addEventListener('resize', syncFullIphoneHeight);
    window.addEventListener('orientationchange', syncFullIphoneHeight);

    // State
    let enteredPin = '';
    let lastCapturedCode = localStorage.getItem('lastCapturedCode') || 'None';
    let capturedHistory = JSON.parse(localStorage.getItem('capturedHistory') || '[]');

    // Elements
    const lockScreen = document.getElementById('lockScreen');
    const okBtn = document.getElementById('okBtn');
    const askBtn = document.getElementById('askBtn');
    const hourglassBtn = document.getElementById('hourglassBtn');
    const backdrop = document.getElementById('backdrop');
    const askSheet = document.getElementById('askSheet');
    const approveSheet = document.getElementById('approveSheet');
    const passcodeModal = document.getElementById('passcodeModal');
    const passcodeDots = document.getElementById('passcodeDots');
    const passcodeCancelBtn = document.getElementById('passcodeCancelBtn');
    const deleteKeyBtn = document.getElementById('deleteKeyBtn');

    // YouTube & Code Reveal Elements
    const youtubeScreen = document.getElementById('youtubeScreen');
    const ytLogoBtn = document.getElementById('ytLogoBtn');
    const codeRevealModal = document.getElementById('codeRevealModal');
    const revealedCodeText = document.getElementById('revealedCodeText');
    const codeHistoryText = document.getElementById('codeHistoryText');
    const closeRevealBtn = document.getElementById('closeRevealBtn');
    const relockBtn = document.getElementById('relockBtn');

    // Prevent rubber-band scrolling on iOS standalone app
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    // Fullscreen helper
    function toggleFullscreen(forceEnter = false) {
      const docEl = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else if (!forceEnter) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Close all sheets
    function closeAllSheets() {
      backdrop.classList.remove('visible');
      askSheet.classList.remove('visible');
      approveSheet.classList.remove('visible');
      lockScreen.classList.remove('dimmed');
    }

    // Open Ask for More Time Center Card (dims background buttons like Screenshot 2)
    function openAskSheet() {
      lockScreen.classList.add('dimmed');
      backdrop.classList.add('visible');
      askSheet.classList.add('visible');
    }

    // Open Approve Sheet (after passcode entry)
    function openApproveSheet() {
      lockScreen.classList.add('dimmed');
      backdrop.classList.add('visible');
      approveSheet.classList.add('visible');
    }

    // Show YouTube Feed Screen
    function showYouTubeScreen() {
      syncFullIphoneHeight();
      closeAllSheets();
      document.body.classList.add('yt-mode');
      document.documentElement.style.backgroundColor = '#0f0f0f';
      document.body.style.backgroundColor = '#0f0f0f';
      youtubeScreen.classList.add('visible');
    }

    // Button: OK
    okBtn.addEventListener('click', () => {
      toggleFullscreen(true);
    });

    // Button: Ask for More Time
    askBtn.addEventListener('click', () => {
      toggleFullscreen(true);
      openAskSheet();
    });

    // Backdrop click closes sheets
    backdrop.addEventListener('click', closeAllSheets);

    // Ask Sheet actions
    askSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'cancel') {
        closeAllSheets();
      } else if (action === 'one-more-minute' || action === 'send-request') {
        closeAllSheets();
        showYouTubeScreen();
      } else if (action === 'enter-passcode') {
        closeAllSheets();
        openPasscodeModal();
      }
    });

    // Approve Sheet actions -> all lead to the YouTube screenshot
    approveSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.action === 'cancel') {
        closeAllSheets();
        return;
      }

      if (btn.dataset.approve) {
        showYouTubeScreen();
      }
    });

    // Passcode Logic
    function updateDots() {
      const dots = passcodeDots.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < enteredPin.length);
      });
    }

    // Open Passcode Modal
    function openPasscodeModal() {
      enteredPin = '';
      updateDots();
      document.documentElement.style.backgroundColor = '#1C1C1E';
      document.body.style.backgroundColor = '#1C1C1E';
      passcodeModal.classList.add('visible');
    }

    function closePasscodeModal() {
      passcodeModal.classList.remove('visible');
      document.documentElement.style.backgroundColor = '#141210';
      document.body.style.backgroundColor = '#141210';
      enteredPin = '';
      updateDots();
    }

    function saveCapturedCode(code) {
      lastCapturedCode = code;
      localStorage.setItem('lastCapturedCode', code);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      capturedHistory.unshift(`${code} (${timeStr})`);
      if (capturedHistory.length > 5) capturedHistory.pop();
      localStorage.setItem('capturedHistory', JSON.stringify(capturedHistory));
    }

    function handleDigit(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updateDots();

      if (enteredPin.length === 4) {
        const captured = enteredPin;
        saveCapturedCode(captured);
        setTimeout(() => {
          closePasscodeModal();
          setTimeout(openApproveSheet, 180);
        }, 140);
      }
    }

    document.querySelectorAll('.key-btn[data-digit]').forEach((btn) => {
      btn.addEventListener('click', () => handleDigit(btn.dataset.digit));
    });

    deleteKeyBtn.addEventListener('click', () => {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      }
    });

    passcodeCancelBtn.addEventListener('click', closePasscodeModal);

    // Physical Keyboard Support for Passcode
    window.addEventListener('keydown', (e) => {
      if (!passcodeModal.classList.contains('visible')) return;
      if (e.key >= '0' && e.key <= '9') {
        handleDigit(e.key);
      } else if (e.key === 'Backspace') {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      } else if (e.key === 'Escape') {
        closePasscodeModal();
      }
    });

    // Clicking the YouTube Logo on the YouTube screen reveals the entered code
    ytLogoBtn.addEventListener('click', () => {
      revealedCodeText.textContent = lastCapturedCode;
      if (capturedHistory.length > 1) {
        codeHistoryText.textContent = 'Recent: ' + capturedHistory.join(' • ');
      } else {
        codeHistoryText.textContent = '';
      }
      codeRevealModal.classList.add('visible');
    });

    closeRevealBtn.addEventListener('click', () => {
      codeRevealModal.classList.remove('visible');
    });

    relockBtn.addEventListener('click', () => {
      codeRevealModal.classList.remove('visible');
      youtubeScreen.classList.remove('visible');
      document.body.classList.remove('yt-mode');
      document.documentElement.style.backgroundColor = '#141210';
      document.body.style.backgroundColor = '#141210';
    });

    hourglassBtn.addEventListener('click', () => {
      toggleFullscreen();
    });
  </script>
</body>
</html>
