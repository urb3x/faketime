<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="YouTube" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="manifest" href="manifest.json" />
  <title>YouTube</title>
  <style>
    :root {
      --ios-blue: #007AFF;
      --ios-blue-active: #0062CC;
      --ios-red: #FF453A;
      --sheet-bg: rgba(44, 44, 46, 0.94);
      --sheet-active: rgba(72, 72, 74, 0.94);
      --sheet-cancel-bg: #2C2C2E;
      --sheet-divider: rgba(255, 255, 255, 0.14);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(235, 235, 245, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: #1e1e1e;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #1e1e1e;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Blurred dark background extending past all safe-area edges to eliminate any iOS bottom stripe */
    .screen-bg {
      position: fixed;
      top: -100px;
      left: -100px;
      right: -100px;
      bottom: -100px;
      background:
        radial-gradient(circle at 28% 54%, rgba(56, 48, 40, 0.38) 0%, transparent 46%),
        radial-gradient(circle at 50% 42%, rgba(46, 46, 48, 0.55) 0%, transparent 65%),
        radial-gradient(circle at 75% 75%, rgba(36, 36, 38, 0.45) 0%, transparent 50%),
        #1e1e1e;
      z-index: 0;
    }

    /* Main Time Limit Lock Screen */
    .lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top, 20px)) 24px calc(env(safe-area-inset-bottom, 16px) + 26px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .top-spacer {
      flex: 1.05;
    }

    /* Center Hourglass + Text */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    .hourglass-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .hourglass-btn:active {
      transform: scale(0.94);
    }

    .hourglass-svg {
      width: 58px;
      height: 76px;
      overflow: visible;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ffffff;
      margin-bottom: 13px;
      line-height: 1.18;
    }

    .subtitle {
      font-size: 16.5px;
      font-weight: 400;
      letter-spacing: -0.15px;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.35;
    }

    .bottom-spacer {
      flex: 1.25;
    }

    /* Bottom Action Buttons */
    .bottom-actions {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 21px;
      margin-bottom: 10px;
    }

    .ok-btn {
      width: 204px;
      height: 50px;
      border-radius: 999px;
      background-color: var(--ios-blue);
      color: #000000;
      font-size: 17px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.12s ease, opacity 0.12s ease;
    }

    .ok-btn:active {
      background-color: var(--ios-blue-active);
      transform: scale(0.97);
    }

    .ask-btn {
      background: none;
      border: none;
      color: var(--ios-blue);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      cursor: pointer;
      padding: 4px 12px;
      transition: opacity 0.12s ease;
    }

    .ask-btn:active {
      opacity: 0.55;
    }

    /* iOS Home Indicator Bar - hidden on real iOS standalone PWA since iOS already draws its own native home bar */
    .home-indicator {
      position: fixed;
      bottom: max(8px, env(safe-area-inset-bottom, 8px));
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 5px;
      background-color: #ffffff;
      border-radius: 100px;
      z-index: 100;
      opacity: 0.95;
      cursor: pointer;
    }

    @media all and (display-mode: standalone), all and (display-mode: fullscreen) {
      .home-indicator {
        display: none;
      }
    }

    /* Backdrop for Action Sheets & Modals */
    .overlay-backdrop {
      position: fixed;
      top: -50px;
      left: -50px;
      right: -50px;
      bottom: -50px;
      background: rgba(0, 0, 0, 0.48);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .overlay-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* iOS Action Sheet */
    .action-sheet-container {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 12px);
      transform: translate(-50%, 130%);
      width: calc(100% - 16px);
      max-width: 398px;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-sheet-container.visible {
      transform: translate(-50%, 0);
    }

    .action-group {
      background: var(--sheet-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 14px;
      overflow: hidden;
    }

    .action-item {
      width: 100%;
      min-height: 57px;
      background: transparent;
      border: none;
      border-bottom: 0.5px solid var(--sheet-divider);
      color: #0A84FF;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 12px 16px;
      text-align: center;
      transition: background-color 0.1s ease;
    }

    .action-item:last-child {
      border-bottom: none;
    }

    .action-item:active {
      background: var(--sheet-active);
    }

    .action-cancel {
      width: 100%;
      min-height: 57px;
      background: var(--sheet-cancel-bg);
      border: none;
      border-radius: 14px;
      color: #0A84FF;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-cancel:active {
      background: #3A3A3C;
    }

    /* Screen Time Passcode Screen */
    .passcode-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      background: rgba(22, 22, 24, 0.94);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 20px) + 12px) 24px calc(env(safe-area-inset-bottom, 16px) + 30px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .passcode-modal.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .passcode-topbar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .passcode-cancel-btn {
      background: none;
      border: none;
      color: #0A84FF;
      font-size: 17px;
      cursor: pointer;
      padding: 6px 4px;
    }

    .passcode-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .passcode-title {
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
    }

    .passcode-subtitle {
      font-size: 14px;
      color: rgba(235, 235, 245, 0.65);
      margin-top: -10px;
      min-height: 18px;
    }

    .passcode-dots {
      display: flex;
      gap: 22px;
      margin-top: 4px;
    }

    .passcode-dots.shake {
      animation: iosShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes iosShake {
      10%, 90% { transform: translateX(-6px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-12px); }
      40%, 60% { transform: translateX(12px); }
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background: transparent;
      transition: background-color 0.12s ease;
    }

    .dot.filled {
      background: #ffffff;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 78px);
      gap: 16px 26px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .key-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .key-btn:active {
      background: rgba(255, 255, 255, 0.38);
    }

    .key-num {
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
    }

    .key-letters {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.8px;
      margin-top: 2px;
      min-height: 11px;
    }

    .key-empty {
      visibility: hidden;
    }

    .key-delete {
      background: transparent;
      font-size: 16px;
      font-weight: 400;
    }

    .key-delete:active {
      background: transparent;
      opacity: 0.6;
    }

    /* Unlocked YouTube Screen (shown after logging in) - edge-to-edge full iPhone screen */
    .youtube-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 45;
      background: #0f0f0f;
      display: flex;
      align-items: stretch;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .youtube-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .youtube-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      overflow: hidden;
      background: #0f0f0f;
    }

    .youtube-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* Invisible Hotspot directly over the YouTube Logo in top-left */
    .yt-logo-hotspot {
      position: absolute;
      top: 4.5%;
      left: 1.5%;
      width: 36%;
      height: 6.8%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 50;
    }

    /* Revealed Passcode Popup when clicking YouTube logo */
    .code-reveal-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .code-reveal-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .code-reveal-card {
      width: 100%;
      max-width: 300px;
      background: rgba(44, 44, 46, 0.96);
      border: 0.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 22px 20px 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.6);
    }

    .code-reveal-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(235, 235, 245, 0.6);
    }

    .code-reveal-value {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #30D158;
      font-variant-numeric: tabular-nums;
      padding-left: 8px;
    }

    .code-history-list {
      font-size: 13px;
      color: rgba(235, 235, 245, 0.65);
      line-height: 1.4;
    }

    .code-reveal-actions {
      display: flex;
      width: 100%;
      gap: 8px;
      margin-top: 6px;
    }

    .code-reveal-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .code-reveal-btn.primary {
      background: var(--ios-blue);
      color: #ffffff;
    }

    .code-reveal-btn.secondary {
      background: #3A3A3C;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Ambient Dark Background matching first screenshot -->
  <div class="screen-bg"></div>

  <!-- Main Apple Screen Time Lock Screen -->
  <main id="lockScreen" class="lock-screen">
    <div class="top-spacer"></div>

    <div class="center-content">
      <button id="hourglassBtn" class="hourglass-btn" title="Tap for Fullscreen">
        <svg class="hourglass-svg" viewBox="0 0 64 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6C8.68629 6 6 8.68629 6 12V19C6 27.6 11.4 35.1 19.3 39.2C21.8 40.5 21.8 43.5 19.3 44.8C11.4 48.9 6 56.4 6 65V72C6 75.3137 8.68629 78 12 78H52C55.3137 78 58 75.3137 58 72V65C58 56.4 52.6 48.9 44.7 44.8C42.2 43.5 42.2 40.5 44.7 39.2C52.6 35.1 58 27.6 58 19V12C58 8.68629 55.3137 6 52 6H12Z" fill="#5A5A5C"/>
          <path d="M12.5 72.5C12.5 70.8 23.2 58.2 29.3 53.2C30.9 51.9 33.1 51.9 34.7 53.2C40.8 58.2 51.5 70.8 51.5 72.5H12.5Z" fill="#FFFFFF"/>
        </svg>
      </button>

      <h1 class="title">Time Limit</h1>
      <p id="limitMessage" class="subtitle">You’ve reached your limit on Youtube.</p>
    </div>

    <div class="bottom-spacer"></div>

    <div class="bottom-actions">
      <button id="okBtn" class="ok-btn">OK</button>
      <button id="askBtn" class="ask-btn">Ask For More Time</button>
    </div>
  </main>

  <!-- Backdrop for Action Sheets -->
  <div id="backdrop" class="overlay-backdrop"></div>

  <!-- 1. "Ask For More Time" iOS Action Sheet -->
  <div id="askSheet" class="action-sheet-container" aria-hidden="true">
    <div class="action-group">
      <button class="action-item" data-action="one-more-minute">One More Minute</button>
      <button class="action-item" data-action="enter-passcode">Enter Screen Time Passcode</button>
    </div>
    <button class="action-cancel" data-action="cancel">Cancel</button>
  </div>

  <!-- 2. Post-Passcode Approval Duration Action Sheet -->
  <div id="approveSheet" class="action-sheet-container" aria-hidden="true">
    <div class="action-group">
      <button class="action-item" data-approve="15">Approve for 15 minutes</button>
      <button class="action-item" data-approve="60">Approve for an hour</button>
      <button class="action-item" data-approve="day">Approve all day</button>
    </div>
    <button class="action-cancel" data-action="cancel">Cancel</button>
  </div>

  <!-- 3. Screen Time Passcode Keypad Modal -->
  <div id="passcodeModal" class="passcode-modal" aria-hidden="true">
    <div class="passcode-topbar">
      <button id="passcodeCancelBtn" class="passcode-cancel-btn">Cancel</button>
    </div>

    <div class="passcode-header">
      <div class="passcode-title">Enter Screen Time Passcode</div>
      <div id="passcodeSub" class="passcode-subtitle"></div>
      <div id="passcodeDots" class="passcode-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="keypad">
      <button class="key-btn" data-digit="1"><span class="key-num">1</span><span class="key-letters"></span></button>
      <button class="key-btn" data-digit="2"><span class="key-num">2</span><span class="key-letters">ABC</span></button>
      <button class="key-btn" data-digit="3"><span class="key-num">3</span><span class="key-letters">DEF</span></button>
      <button class="key-btn" data-digit="4"><span class="key-num">4</span><span class="key-letters">GHI</span></button>
      <button class="key-btn" data-digit="5"><span class="key-num">5</span><span class="key-letters">JKL</span></button>
      <button class="key-btn" data-digit="6"><span class="key-num">6</span><span class="key-letters">MNO</span></button>
      <button class="key-btn" data-digit="7"><span class="key-num">7</span><span class="key-letters">PQRS</span></button>
      <button class="key-btn" data-digit="8"><span class="key-num">8</span><span class="key-letters">TUV</span></button>
      <button class="key-btn" data-digit="9"><span class="key-num">9</span><span class="key-letters">WXYZ</span></button>
      <div class="key-btn key-empty"></div>
      <button class="key-btn" data-digit="0"><span class="key-num">0</span><span class="key-letters"></span></button>
      <button id="deleteKeyBtn" class="key-btn key-delete">Delete</button>
    </div>
  </div>

  <!-- 4. Unlocked YouTube Screen (Displays uploaded screenshot & secret YouTube logo button) -->
  <div id="youtubeScreen" class="youtube-screen">
    <div class="youtube-wrapper">
      <img src="youtube.jpg" alt="YouTube" class="youtube-img" />
      <!-- Clicking the YouTube logo in the top-left reveals the entered passcode -->
      <button id="ytLogoBtn" class="yt-logo-hotspot" aria-label="YouTube Logo"></button>
    </div>
  </div>

  <!-- 5. Modal Showing the Entered Passcode when YouTube Logo is Clicked -->
  <div id="codeRevealModal" class="code-reveal-modal">
    <div class="code-reveal-card">
      <div class="code-reveal-label">Entered Screen Time Code</div>
      <div id="revealedCodeText" class="code-reveal-value">----</div>
      <div id="codeHistoryText" class="code-history-list"></div>
      <div class="code-reveal-actions">
        <button id="relockBtn" class="code-reveal-btn secondary">Lock Again</button>
        <button id="closeRevealBtn" class="code-reveal-btn primary">Close</button>
      </div>
    </div>
  </div>

  <!-- iOS Bottom Home Indicator (Hidden automatically when added to Home Screen on iPhone) -->
  <div id="homeIndicator" class="home-indicator" title="Tap to toggle Fullscreen"></div>

  <script>
    // State
    let enteredPin = '';
    let lastCapturedCode = localStorage.getItem('lastCapturedCode') || 'None';
    let capturedHistory = JSON.parse(localStorage.getItem('capturedHistory') || '[]');

    // Elements
    const okBtn = document.getElementById('okBtn');
    const askBtn = document.getElementById('askBtn');
    const hourglassBtn = document.getElementById('hourglassBtn');
    const homeIndicator = document.getElementById('homeIndicator');
    const backdrop = document.getElementById('backdrop');
    const askSheet = document.getElementById('askSheet');
    const approveSheet = document.getElementById('approveSheet');
    const passcodeModal = document.getElementById('passcodeModal');
    const passcodeDots = document.getElementById('passcodeDots');
    const passcodeSub = document.getElementById('passcodeSub');
    const passcodeCancelBtn = document.getElementById('passcodeCancelBtn');
    const deleteKeyBtn = document.getElementById('deleteKeyBtn');

    // YouTube & Code Reveal Elements
    const youtubeScreen = document.getElementById('youtubeScreen');
    const ytLogoBtn = document.getElementById('ytLogoBtn');
    const codeRevealModal = document.getElementById('codeRevealModal');
    const revealedCodeText = document.getElementById('revealedCodeText');
    const codeHistoryText = document.getElementById('codeHistoryText');
    const closeRevealBtn = document.getElementById('closeRevealBtn');
    const relockBtn = document.getElementById('relockBtn');

    // Hide simulated home indicator if running in iOS standalone mode
    if (window.navigator.standalone === true) {
      homeIndicator.style.display = 'none';
    }

    // Prevent rubber-band scrolling on iOS standalone app
    document.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    // Fullscreen helper
    function toggleFullscreen(forceEnter = false) {
      const docEl = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else if (!forceEnter) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Close all sheets
    function closeAllSheets() {
      backdrop.classList.remove('visible');
      askSheet.classList.remove('visible');
      approveSheet.classList.remove('visible');
    }

    // Open Ask For More Time Sheet
    function openAskSheet() {
      backdrop.classList.add('visible');
      askSheet.classList.add('visible');
    }

    // Open Approve Sheet (after passcode entry)
    function openApproveSheet() {
      backdrop.classList.add('visible');
      approveSheet.classList.add('visible');
    }

    // Show YouTube Feed Screen
    function showYouTubeScreen() {
      closeAllSheets();
      youtubeScreen.classList.add('visible');
    }

    // Button: OK -> opens Ask Sheet or keeps user on lock screen
    okBtn.addEventListener('click', () => {
      toggleFullscreen(true);
    });

    // Button: Ask For More Time
    askBtn.addEventListener('click', () => {
      toggleFullscreen(true);
      openAskSheet();
    });

    // Backdrop click closes sheets
    backdrop.addEventListener('click', closeAllSheets);

    // Ask Sheet actions
    askSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'cancel') {
        closeAllSheets();
      } else if (action === 'one-more-minute') {
        closeAllSheets();
        showYouTubeScreen();
      } else if (action === 'enter-passcode') {
        closeAllSheets();
        openPasscodeModal();
      }
    });

    // Approve Sheet actions -> all lead to the YouTube screenshot
    approveSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.action === 'cancel') {
        closeAllSheets();
        return;
      }

      if (btn.dataset.approve) {
        showYouTubeScreen();
      }
    });

    // Passcode Logic
    function updateDots() {
      const dots = passcodeDots.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < enteredPin.length);
      });
    }

    function openPasscodeModal() {
      enteredPin = '';
      updateDots();
      passcodeSub.textContent = '';
      passcodeModal.classList.add('visible');
    }

    function closePasscodeModal() {
      passcodeModal.classList.remove('visible');
      enteredPin = '';
      updateDots();
    }

    function saveCapturedCode(code) {
      lastCapturedCode = code;
      localStorage.setItem('lastCapturedCode', code);
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      capturedHistory.unshift(`${code} (${timeStr})`);
      if (capturedHistory.length > 5) capturedHistory.pop();
      localStorage.setItem('capturedHistory', JSON.stringify(capturedHistory));
    }

    function handleDigit(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updateDots();

      if (enteredPin.length === 4) {
        const captured = enteredPin;
        saveCapturedCode(captured);
        setTimeout(() => {
          closePasscodeModal();
          setTimeout(openApproveSheet, 160);
        }, 140);
      }
    }

    document.querySelectorAll('.key-btn[data-digit]').forEach((btn) => {
      btn.addEventListener('click', () => handleDigit(btn.dataset.digit));
    });

    deleteKeyBtn.addEventListener('click', () => {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      }
    });

    passcodeCancelBtn.addEventListener('click', closePasscodeModal);

    // Physical Keyboard Support for Passcode
    window.addEventListener('keydown', (e) => {
      if (!passcodeModal.classList.contains('visible')) return;
      if (e.key >= '0' && e.key <= '9') {
        handleDigit(e.key);
      } else if (e.key === 'Backspace') {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      } else if (e.key === 'Escape') {
        closePasscodeModal();
      }
    });

    // Clicking the YouTube Logo on the YouTube screen reveals the entered code
    ytLogoBtn.addEventListener('click', () => {
      revealedCodeText.textContent = lastCapturedCode;
      if (capturedHistory.length > 1) {
        codeHistoryText.textContent = 'Recent: ' + capturedHistory.join(' • ');
      } else {
        codeHistoryText.textContent = '';
      }
      codeRevealModal.classList.add('visible');
    });

    closeRevealBtn.addEventListener('click', () => {
      codeRevealModal.classList.remove('visible');
    });

    relockBtn.addEventListener('click', () => {
      codeRevealModal.classList.remove('visible');
      youtubeScreen.classList.remove('visible');
    });

    hourglassBtn.addEventListener('click', () => {
      toggleFullscreen();
    });

    homeIndicator.addEventListener('click', () => {
      toggleFullscreen();
    });
  </script>
</body>
</html>
