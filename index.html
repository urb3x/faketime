<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Time Limit" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1e1e1e" />
  <link rel="manifest" href="manifest.json" />
  <title>Time Limit</title>
  <style>
    :root {
      --ios-blue: #007AFF;
      --ios-blue-active: #0062CC;
      --ios-red: #FF453A;
      --sheet-bg: rgba(44, 44, 46, 0.94);
      --sheet-active: rgba(72, 72, 74, 0.94);
      --sheet-cancel-bg: #2C2C2E;
      --sheet-divider: rgba(255, 255, 255, 0.14);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(235, 235, 245, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      background-color: #1c1c1e;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Blurred dark background matching the reference photo's subtle ambient glow */
    .screen-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 28% 54%, rgba(56, 48, 40, 0.38) 0%, transparent 46%),
        radial-gradient(circle at 50% 42%, rgba(46, 46, 48, 0.55) 0%, transparent 65%),
        radial-gradient(circle at 75% 75%, rgba(36, 36, 38, 0.45) 0%, transparent 50%),
        #1e1e1e;
      z-index: 0;
    }

    /* Main Time Limit Lock Screen */
    .lock-screen {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: env(safe-area-inset-top, 20px) 24px calc(env(safe-area-inset-bottom, 12px) + 28px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .top-spacer {
      flex: 1.05;
    }

    /* Center Hourglass + Text */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    .hourglass-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .hourglass-btn:active {
      transform: scale(0.94);
    }

    .hourglass-svg {
      width: 58px;
      height: 76px;
      overflow: visible;
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #ffffff;
      margin-bottom: 13px;
      line-height: 1.18;
    }

    .subtitle {
      font-size: 16.5px;
      font-weight: 400;
      letter-spacing: -0.15px;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.35;
    }

    .bottom-spacer {
      flex: 1.25;
    }

    /* Bottom Action Buttons */
    .bottom-actions {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 21px;
      margin-bottom: 14px;
    }

    .ok-btn {
      width: 204px;
      height: 50px;
      border-radius: 999px;
      background-color: var(--ios-blue);
      color: #000000;
      font-size: 17px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.12s ease, opacity 0.12s ease;
    }

    .ok-btn:active {
      background-color: var(--ios-blue-active);
      transform: scale(0.97);
    }

    .ask-btn {
      background: none;
      border: none;
      color: var(--ios-blue);
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.2px;
      cursor: pointer;
      padding: 4px 12px;
      transition: opacity 0.12s ease;
    }

    .ask-btn:active {
      opacity: 0.55;
    }

    /* iOS Home Indicator Bar */
    .home-indicator {
      position: fixed;
      bottom: max(8px, env(safe-area-inset-bottom, 8px));
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 5px;
      background-color: #ffffff;
      border-radius: 100px;
      z-index: 100;
      opacity: 0.95;
      cursor: pointer;
    }

    /* Backdrop for Action Sheets & Modals */
    .overlay-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }

    .overlay-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* iOS Action Sheet */
    .action-sheet-container {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 18px);
      transform: translate(-50%, 120%);
      width: calc(100% - 16px);
      max-width: 398px;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-sheet-container.visible {
      transform: translate(-50%, 0);
    }

    .action-group {
      background: var(--sheet-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 14px;
      overflow: hidden;
    }

    .action-sheet-header {
      padding: 13px 16px;
      text-align: center;
      font-size: 13px;
      color: rgba(235, 235, 245, 0.6);
      border-bottom: 0.5px solid var(--sheet-divider);
      line-height: 1.35;
    }

    .action-item {
      width: 100%;
      min-height: 57px;
      background: transparent;
      border: none;
      border-bottom: 0.5px solid var(--sheet-divider);
      color: #0A84FF;
      font-size: 20px;
      font-weight: 400;
       letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 12px 16px;
      text-align: center;
      transition: background-color 0.1s ease;
    }

    .action-item:last-child {
      border-bottom: none;
    }

    .action-item:active {
      background: var(--sheet-active);
    }

    .action-cancel {
      width: 100%;
      min-height: 57px;
      background: var(--sheet-cancel-bg);
      border: none;
      border-radius: 14px;
      color: #0A84FF;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-cancel:active {
      background: #3A3A3C;
    }

    /* Screen Time Passcode Screen */
    .passcode-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(22, 22, 24, 0.92);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 24px calc(env(safe-area-inset-bottom, 16px) + 36px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .passcode-modal.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .passcode-topbar {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .passcode-cancel-btn {
      background: none;
      border: none;
      color: #0A84FF;
      font-size: 17px;
      cursor: pointer;
      padding: 6px 4px;
    }

    .passcode-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 10px;
    }

    .passcode-title {
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
    }

    .passcode-subtitle {
      font-size: 14px;
      color: rgba(235, 235, 245, 0.65);
      margin-top: -10px;
      min-height: 18px;
    }

    .passcode-dots {
      display: flex;
      gap: 22px;
      margin-top: 4px;
    }

    .passcode-dots.shake {
      animation: iosShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes iosShake {
      10%, 90% { transform: translateX(-6px); }
      20%, 80% { transform: translateX(8px); }
      30%, 50%, 70% { transform: translateX(-12px); }
      40%, 60% { transform: translateX(12px); }
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid #ffffff;
      background: transparent;
      transition: background-color 0.12s ease;
    }

    .dot.filled {
      background: #ffffff;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 78px);
      gap: 16px 26px;
      justify-content: center;
      margin-bottom: 12px;
    }

    .key-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .key-btn:active {
      background: rgba(255, 255, 255, 0.38);
    }

    .key-num {
      font-size: 34px;
      font-weight: 300;
      line-height: 1;
    }

    .key-letters {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.8px;
      margin-top: 2px;
      min-height: 11px;
    }

    .key-empty {
      visibility: hidden;
    }

    .key-delete {
      background: transparent;
      font-size: 16px;
      font-weight: 400;
    }

    .key-delete:active {
      background: transparent;
      opacity: 0.6;
    }

    /* Unlocked / Approved Toast & Customization Drawer */
    .unlocked-banner {
      position: fixed;
      top: max(18px, env(safe-area-inset-top, 18px));
      left: 50%;
      transform: translate(-50%, -140%);
      background: rgba(44, 44, 46, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 0.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 10px 20px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .unlocked-banner.visible {
      transform: translate(-50%, 0);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #30D158;
    }

    /* Hidden Control Panel (Double-click / Long-press Hourglass to customize) */
    .settings-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .settings-modal.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-card {
      width: 100%;
      max-width: 350px;
      background: #2C2C2E;
      border-radius: 18px;
      padding: 20px;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .settings-card h3 {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 12px;
      color: rgba(235, 235, 245, 0.65);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field-group input, .field-group select {
      background: #1C1C1E;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .settings-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .settings-btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .settings-btn.primary {
      background: var(--ios-blue);
      color: #ffffff;
    }

    .settings-btn.secondary {
      background: #3A3A3C;
      color: #ffffff;
    }

    /* Dismissed ("OK" pressed) simulated iOS Home Screen / Closed state */
    .dismissed-screen {
      position: fixed;
      inset: 0;
      z-index: 15;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .dismissed-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .reopen-card {
      background: #1C1C1E;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 24px 28px;
      text-align: center;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .reopen-card p {
      font-size: 15px;
      color: rgba(235, 235, 245, 0.75);
      line-height: 1.4;
    }

    .reopen-btn {
      background: var(--ios-blue);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Ambient Dark Background matching uploaded screenshot -->
  <div class="screen-bg"></div>

  <!-- Toast Banner for feedback -->
  <div id="toastBanner" class="unlocked-banner">
    <span class="status-dot"></span>
    <span id="toastText">Approved for 15 minutes</span>
  </div>

  <!-- Main Apple Screen Time Lock Screen -->
  <main id="lockScreen" class="lock-screen">
    <div class="top-spacer"></div>

    <div class="center-content">
      <!-- Tapping hourglass toggles fullscreen; double-tapping/long-pressing opens secret customizer -->
      <button id="hourglassBtn" class="hourglass-btn" title="Tap for Fullscreen • Double-tap to customize">
        <svg class="hourglass-svg" viewBox="0 0 64 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer Hourglass Silhouette matching iOS Screen Time icon -->
          <path d="M12 6C8.68629 6 6 8.68629 6 12V19C6 27.6 11.4 35.1 19.3 39.2C21.8 40.5 21.8 43.5 19.3 44.8C11.4 48.9 6 56.4 6 65V72C6 75.3137 8.68629 78 12 78H52C55.3137 78 58 75.3137 58 72V65C58 56.4 52.6 48.9 44.7 44.8C42.2 43.5 42.2 40.5 44.7 39.2C52.6 35.1 58 27.6 58 19V12C58 8.68629 55.3137 6 52 6H12Z" fill="#5A5A5C"/>
          <!-- White Sand Mound at Bottom -->
          <path d="M12.5 72.5C12.5 70.8 23.2 58.2 29.3 53.2C30.9 51.9 33.1 51.9 34.7 53.2C40.8 58.2 51.5 70.8 51.5 72.5H12.5Z" fill="#FFFFFF"/>
        </svg>
      </button>

      <h1 class="title">Time Limit</h1>
      <p id="limitMessage" class="subtitle">You’ve reached your limit on Youtube.</p>
    </div>

    <div class="bottom-spacer"></div>

    <div class="bottom-actions">
      <button id="okBtn" class="ok-btn">OK</button>
      <button id="askBtn" class="ask-btn">Ask For More Time</button>
    </div>
  </main>

  <!-- Simulated Dismissed / Unlocked State -->
  <div id="dismissedScreen" class="dismissed-screen">
    <div class="reopen-card">
      <h3 id="dismissedTitle">App Closed</h3>
      <p id="dismissedDesc">Screen Time locked Youtube.</p>
      <button id="restoreLockBtn" class="reopen-btn">Show Time Limit Again</button>
    </div>
  </div>

  <!-- Backdrop for Action Sheets -->
  <div id="backdrop" class="overlay-backdrop"></div>

  <!-- 1. "Ask For More Time" iOS Action Sheet -->
  <div id="askSheet" class="action-sheet-container" aria-hidden="true">
    <div class="action-group">
      <button class="action-item" data-action="one-more-minute">One More Minute</button>
      <button class="action-item" data-action="remind-15">Remind Me in 15 Minutes</button>
      <button class="action-item" data-action="ignore-today">Ignore Limit for Today</button>
      <button class="action-item" data-action="enter-passcode">Enter Screen Time Passcode</button>
    </div>
    <button class="action-cancel" data-action="cancel">Cancel</button>
  </div>

  <!-- 2. Post-Passcode Approval Duration Action Sheet -->
  <div id="approveSheet" class="action-sheet-container" aria-hidden="true">
    <div class="action-group">
      <button class="action-item" data-approve="15">Approve for 15 minutes</button>
      <button class="action-item" data-approve="60">Approve for an hour</button>
      <button class="action-item" data-approve="day">Approve all day</button>
    </div>
    <button class="action-cancel" data-action="cancel">Cancel</button>
  </div>

  <!-- 3. Screen Time Passcode Keypad Modal -->
  <div id="passcodeModal" class="passcode-modal" aria-hidden="true">
    <div class="passcode-topbar">
      <button id="passcodeCancelBtn" class="passcode-cancel-btn">Cancel</button>
    </div>

    <div class="passcode-header">
      <div class="passcode-title">Enter Screen Time Passcode</div>
      <div id="passcodeSub" class="passcode-subtitle"></div>
      <div id="passcodeDots" class="passcode-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="keypad">
      <button class="key-btn" data-digit="1"><span class="key-num">1</span><span class="key-letters"></span></button>
      <button class="key-btn" data-digit="2"><span class="key-num">2</span><span class="key-letters">ABC</span></button>
      <button class="key-btn" data-digit="3"><span class="key-num">3</span><span class="key-letters">DEF</span></button>
      <button class="key-btn" data-digit="4"><span class="key-num">4</span><span class="key-letters">GHI</span></button>
      <button class="key-btn" data-digit="5"><span class="key-num">5</span><span class="key-letters">JKL</span></button>
      <button class="key-btn" data-digit="6"><span class="key-num">6</span><span class="key-letters">MNO</span></button>
      <button class="key-btn" data-digit="7"><span class="key-num">7</span><span class="key-letters">PQRS</span></button>
      <button class="key-btn" data-digit="8"><span class="key-num">8</span><span class="key-letters">TUV</span></button>
      <button class="key-btn" data-digit="9"><span class="key-num">9</span><span class="key-letters">WXYZ</span></button>
      <div class="key-btn key-empty"></div>
      <button class="key-btn" data-digit="0"><span class="key-num">0</span><span class="key-letters"></span></button>
      <button id="deleteKeyBtn" class="key-btn key-delete">Delete</button>
    </div>
  </div>

  <!-- 4. Secret Customization Modal (Double-tap Hourglass) -->
  <div id="settingsModal" class="settings-modal">
    <div class="settings-card">
      <h3>Customize Fake Screen Time</h3>
      <div class="field-group">
        <label for="appNameInput">App Name</label>
        <input id="appNameInput" type="text" value="Youtube" placeholder="e.g. Youtube, TikTok, Instagram" />
      </div>
      <div class="field-group">
        <label for="passcodeInput">Required Passcode (leave blank for any 4 digits)</label>
        <input id="passcodeInput" type="text" maxlength="4" pattern="[0-9]*" inputmode="numeric" value="" placeholder="Any 4 digits" />
      </div>
      <div class="field-group">
        <label for="sheetModeSelect">Ask For More Time Menu Style</label>
        <select id="sheetModeSelect">
          <option value="full">Full Options (One More Min / Ignore / Passcode)</option>
          <option value="strict">Strict Parental (One More Min / Enter Passcode)</option>
        </select>
      </div>
      <div class="settings-actions">
        <button id="fullscreenToggleBtn" class="settings-btn secondary">Toggle Fullscreen</button>
        <button id="saveSettingsBtn" class="settings-btn primary">Done</button>
      </div>
    </div>
  </div>

  <!-- iOS Bottom Home Indicator (Tap to toggle Fullscreen) -->
  <div id="homeIndicator" class="home-indicator" title="Tap to toggle Fullscreen"></div>

  <script>
    // State
    let appName = 'Youtube';
    let requiredPasscode = ''; // Empty means any 4-digit code works
    let sheetMode = 'full';
    let enteredPin = '';
    let failedAttempts = 0;
    let toastTimeout = null;

    // Elements
    const limitMessage = document.getElementById('limitMessage');
    const okBtn = document.getElementById('okBtn');
    const askBtn = document.getElementById('askBtn');
    const hourglassBtn = document.getElementById('hourglassBtn');
    const homeIndicator = document.getElementById('homeIndicator');
    const backdrop = document.getElementById('backdrop');
    const askSheet = document.getElementById('askSheet');
    const approveSheet = document.getElementById('approveSheet');
    const passcodeModal = document.getElementById('passcodeModal');
    const passcodeDots = document.getElementById('passcodeDots');
    const passcodeSub = document.getElementById('passcodeSub');
    const passcodeCancelBtn = document.getElementById('passcodeCancelBtn');
    const deleteKeyBtn = document.getElementById('deleteKeyBtn');
    const dismissedScreen = document.getElementById('dismissedScreen');
    const dismissedTitle = document.getElementById('dismissedTitle');
    const dismissedDesc = document.getElementById('dismissedDesc');
    const restoreLockBtn = document.getElementById('restoreLockBtn');
    const toastBanner = document.getElementById('toastBanner');
    const toastText = document.getElementById('toastText');

    // Settings Elements
    const settingsModal = document.getElementById('settingsModal');
    const appNameInput = document.getElementById('appNameInput');
    const passcodeInput = document.getElementById('passcodeInput');
    const sheetModeSelect = document.getElementById('sheetModeSelect');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');

    // Fullscreen helper
    function toggleFullscreen(forceEnter = false) {
      const docEl = document.documentElement;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (!isFs) {
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      } else if (!forceEnter) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    // Show toast notification
    function showToast(message) {
      toastText.textContent = message;
      toastBanner.classList.add('visible');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastBanner.classList.remove('visible');
      }, 2800);
    }

    // Close all sheets
    function closeAllSheets() {
      backdrop.classList.remove('visible');
      askSheet.classList.remove('visible');
      approveSheet.classList.remove('visible');
    }

    // Open Ask For More Time Sheet
    function openAskSheet() {
      // Configure buttons based on mode
      const remindBtn = askSheet.querySelector('[data-action="remind-15"]');
      const ignoreBtn = askSheet.querySelector('[data-action="ignore-today"]');
      if (sheetMode === 'strict') {
        remindBtn.style.display = 'none';
        ignoreBtn.style.display = 'none';
      } else {
        remindBtn.style.display = 'flex';
        ignoreBtn.style.display = 'flex';
      }

      backdrop.classList.add('visible');
      askSheet.classList.add('visible');
    }

    // Open Approve Sheet (after passcode success)
    function openApproveSheet() {
      backdrop.classList.add('visible');
      approveSheet.classList.add('visible');
    }

    // Show Dismissed / Unlocked Screen
    function showDismissedState(title, description) {
      closeAllSheets();
      dismissedTitle.textContent = title;
      dismissedDesc.textContent = description;
      dismissedScreen.classList.add('visible');
    }

    // Button: OK
    okBtn.addEventListener('click', () => {
      toggleFullscreen(true);
      showDismissedState('App Closed', `You pressed OK and exited ${appName}.`);
    });

    // Button: Ask For More Time
    askBtn.addEventListener('click', () => {
      toggleFullscreen(true);
      openAskSheet();
    });

    // Backdrop click closes sheets
    backdrop.addEventListener('click', closeAllSheets);

    // Ask Sheet actions
    askSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'cancel') {
        closeAllSheets();
      } else if (action === 'one-more-minute') {
        closeAllSheets();
        showToast(`1 more minute granted on ${appName}`);
        showDismissedState('Unlocked for 1 Minute', `${appName} is unlocked for 1 more minute.`);
      } else if (action === 'remind-15') {
        closeAllSheets();
        showToast(`Reminder set for 15 minutes`);
        showDismissedState('Unlocked for 15 Minutes', `You'll be reminded about ${appName} in 15 minutes.`);
      } else if (action === 'ignore-today') {
        closeAllSheets();
        showToast(`Limit ignored for today`);
        showDismissedState('Unlocked for Today', `Screen Time limit ignored for ${appName} today.`);
      } else if (action === 'enter-passcode') {
        closeAllSheets();
        openPasscodeModal();
      }
    });

    // Approve Sheet actions
    approveSheet.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.action === 'cancel') {
        closeAllSheets();
        return;
      }

      const approve = btn.dataset.approve;
      closeAllSheets();
      if (approve === '15') {
        showToast(`Approved for 15 minutes`);
        showDismissedState('Approved for 15 Minutes', `${appName} has been unlocked for 15 minutes.`);
      } else if (approve === '60') {
        showToast(`Approved for 1 hour`);
        showDismissedState('Approved for 1 Hour', `${appName} has been unlocked for 1 hour.`);
      } else if (approve === 'day') {
        showToast(`Approved all day`);
        showDismissedState('Approved All Day', `${appName} has been unlocked for the rest of today.`);
      }
    });

    // Restore Lock Screen button
    restoreLockBtn.addEventListener('click', () => {
      dismissedScreen.classList.remove('visible');
    });

    // Passcode Logic
    function updateDots() {
      const dots = passcodeDots.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.classList.toggle('filled', idx < enteredPin.length);
      });
    }

    function openPasscodeModal() {
      enteredPin = '';
      updateDots();
      passcodeSub.textContent = '';
      passcodeModal.classList.add('visible');
    }

    function closePasscodeModal() {
      passcodeModal.classList.remove('visible');
      enteredPin = '';
      updateDots();
    }

    function handleDigit(digit) {
      if (enteredPin.length >= 4) return;
      enteredPin += digit;
      updateDots();

      if (enteredPin.length === 4) {
        setTimeout(() => {
          if (!requiredPasscode || enteredPin === requiredPasscode) {
            closePasscodeModal();
            setTimeout(openApproveSheet, 180);
          } else {
            failedAttempts++;
            passcodeSub.textContent = `${failedAttempts} Failed Passcode Attempt${failedAttempts > 1 ? 's' : ''}`;
            passcodeDots.classList.remove('shake');
            void passcodeDots.offsetWidth; // trigger reflow
            passcodeDots.classList.add('shake');
            enteredPin = '';
            setTimeout(updateDots, 300);
          }
        }, 120);
      }
    }

    document.querySelectorAll('.key-btn[data-digit]').forEach((btn) => {
      btn.addEventListener('click', () => handleDigit(btn.dataset.digit));
    });

    deleteKeyBtn.addEventListener('click', () => {
      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      }
    });

    passcodeCancelBtn.addEventListener('click', closePasscodeModal);

    // Physical Keyboard Support for Passcode
    window.addEventListener('keydown', (e) => {
      if (!passcodeModal.classList.contains('visible')) return;
      if (e.key >= '0' && e.key <= '9') {
        handleDigit(e.key);
      } else if (e.key === 'Backspace') {
        enteredPin = enteredPin.slice(0, -1);
        updateDots();
      } else if (e.key === 'Escape') {
        closePasscodeModal();
      }
    });

    // Hourglass single-tap (fullscreen) and double-tap (settings)
    let lastTap = 0;
    hourglassBtn.addEventListener('click', () => {
      const now = Date.now();
      if (now - lastTap < 350) {
        settingsModal.classList.add('visible');
      } else {
        toggleFullscreen();
      }
      lastTap = now;
    });

    homeIndicator.addEventListener('click', () => {
      toggleFullscreen();
    });

    fullscreenToggleBtn.addEventListener('click', () => {
      toggleFullscreen();
    });

    saveSettingsBtn.addEventListener('click', () => {
      const val = appNameInput.value.trim();
      appName = val || 'Youtube';
      limitMessage.textContent = `You’ve reached your limit on ${appName}.`;
      requiredPasscode = passcodeInput.value.trim();
      sheetMode = sheetModeSelect.value;
      settingsModal.classList.remove('visible');
      showToast('Settings saved');
    });
  </script>
</body>
</html>
